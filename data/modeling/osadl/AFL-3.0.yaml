_audit:
  osadl_file: AFL-3.0-opt.json
  profile_version: 4
  provides:
  - copyleft_status
  - categories
  - disclose_forms
  - redistribute
  - redistribute_slices
  - must_not_hints
  - patent_hints
  - apache_hints
  - license_choice
  - terms_slices
  - network_service
  schema_gaps: []
apache_hints:
  forward_patent: true
  forward_trademark: true
categories:
  copyleft: false
  disclose: true
copyleft_status: 'no'
disclose_forms:
- raw
- binary
- saas
license_choice: true
must_not_hints:
  promote_ban: true
network_service: true
not_provided:
- usages
- result
- relicense
- compat
- rights
- coverage
- labels
patent_hints: true
redistribute:
  include_notice: true
redistribute_slices:
- forms:
  - raw
  include_notice: true
- forms:
  - binary
  include_notice: true
- forms:
  - saas
  include_notice: true
short_id: AFL-3.0
terms_slices:
- forms:
  - binary
  - raw
  - saas
  obligations:
  - source_disclosure
  restrictions:
  - state_changes
  when:
  - software_modification
